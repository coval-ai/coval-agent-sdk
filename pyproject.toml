[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coval-agent-sdk"
version = "0.2.0a1"
description = "Python client for Coval Agent SDK voice sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "websockets>=15,<16",
]

[project.urls]
Source = "https://github.com/coval-ai/coval-agent-sdk"
Documentation = "https://github.com/coval-ai/coval-agent-sdk#readme"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pyright==1.1.414", "twine>=6,<7"]

[project.scripts]
coval-tunnel = "coval_voice.client:cli"

[tool.setuptools]
py-modules = ["coval_tracing", "coval_tunnel"]
packages = ["coval_voice"]

[tool.setuptools.package-data]
coval_voice = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
