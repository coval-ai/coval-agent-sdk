[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coval-agent-sdk"
version = "0.2.0a1"
description = "Python client for Coval Agent SDK voice sessions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Coval, Inc."}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "websockets>=15,<16",
]

[project.urls]
Source = "https://github.com/coval-ai/coval-agent-sdk"
Documentation = "https://github.com/coval-ai/coval-agent-sdk#readme"
Issues = "https://github.com/coval-ai/coval-agent-sdk/issues"
Changelog = "https://github.com/coval-ai/coval-agent-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pyright==1.1.414",
  "ruff==0.17.1",
  "twine>=6,<7",
]

[project.scripts]
coval-agent = "coval_agent_sdk._cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["coval_agent_sdk*"]
namespaces = false

[tool.setuptools.package-data]
coval_agent_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.1"
target-version = "py310"
line-length = 80
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "ISC",
  "C901", "ICN", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PTH", "RUF",
  "D", "ANN", "ASYNC", "S",
]
# Ruff formats long literals/comments best-effort; E501 still checks prose/code.
ignore = ["ISC001"]  # Conflicts with the formatter's implicit concatenation.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
order-by-type = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S101", "S105", "S106", "ARG", "PT009", "PT027", "C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.mccabe]
max-complexity = 15
