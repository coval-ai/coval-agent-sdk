[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coval-agent-sdk"
version = "0.1.0"
description = "Python client for Coval Agent SDK voice sessions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Coval, Inc."}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
  "coval-sdk>=0.9.2,<0.10",
  "urllib3>=2.1,<3",
  "websockets>=15,<16",
]

[project.urls]
Source = "https://github.com/coval-ai/coval-agent-sdk"
Documentation = "https://docs.coval.ai/sdks/agent-sdk"
Issues = "https://github.com/coval-ai/coval-agent-sdk/issues"
Changelog = "https://github.com/coval-ai/coval-agent-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tracing = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-common>=1.30,<2",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pyright==1.1.414",
  "python-semantic-release==10.7.0",
  "ruff==0.17.1",
  "twine>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["coval_agent_sdk*"]
namespaces = false

[tool.setuptools.package-data]
coval_agent_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.1"
target-version = "py310"
line-length = 80
src = ["src"]

[tool.ruff.per-file-target-version]
"scripts/validate_release.py" = "py312"
"release_tests/**" = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "ISC",
  "C901", "ICN", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PTH", "RUF",
  "D", "ANN", "ASYNC", "S",
]
# Ruff formats long literals/comments best-effort; E501 still checks prose/code.
ignore = ["ISC001"]  # Conflicts with the formatter's implicit concatenation.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
order-by-type = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"release_tests/**" = ["ANN", "D", "S101", "S105", "S106", "ARG", "PT009", "PT027", "C901"]
"tests/**" = ["ANN", "D", "S101", "S105", "S106", "ARG", "PT009", "PT027", "C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.semantic_release]
allow_zero_version = true
major_on_zero = true
commit_parser = "conventional"
commit_message = "chore(release): {version}"
commit_author = "Coval Release Automation <coval-release-automation[bot]@users.noreply.github.com>"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "init"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = false

[tool.semantic_release.remote]
url = "https://github.com/coval-ai/coval-agent-sdk.git"
ignore_token_for_push = true
