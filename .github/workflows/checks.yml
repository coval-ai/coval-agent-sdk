name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.4"
      - name: Install SDK and development tools
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: scripts/install
      - name: Validate style, types, architecture, and installed wheel
        run: scripts/check

  release-tools:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.4"
      - name: Install SDK and release tools
        env:
          PYTHON_VERSION: "3.12"
        run: scripts/install
      - name: Exercise semantic releases and publication guards
        run: .venv/bin/python -m pytest release_tests -q
