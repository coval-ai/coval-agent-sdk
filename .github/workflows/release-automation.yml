name: Release Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coval-agent-sdk-release-automation
  cancel-in-progress: false

jobs:
  release:
    name: Prepare version, changelog, and tag
    if: github.actor != 'coval-release-automation[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Release Automation must run from main." >&2
            exit 1
          fi
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.4"
      - name: Install SDK and release tools
        env:
          PYTHON_VERSION: "3.12"
        run: scripts/install
      - name: Prepare release locally
        id: version
        run: .venv/bin/semantic-release version --no-push --no-vcs-release --skip-build
      - name: Validate and push generated release
        if: steps.version.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          .venv/bin/python scripts/validate_release.py prepared "$RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
